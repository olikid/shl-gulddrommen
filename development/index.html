.arcade-awards-page{gap:12px}
.arcade-awards-heading{letter-spacing:.7px;text-transform:none;font-size:20px}
.arcade-awards-grid{gap:10px}
.arcade-award{--medal:#c99362;--medal-light:#f0cda5;--medal-dark:#7c4e31;position:relative;isolation:isolate;overflow:hidden;padding:18px 9px 14px;gap:8px;border-color:color-mix(in srgb,var(--medal) 52%,#29455f);background:linear-gradient(155deg,#294057 0%,#1c3248 55%,#172b40 100%);box-shadow:inset 0 1px 0 #ffffff0b,0 3px 9px #071b2b30;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.arcade-award.silver{--medal:#9cbdd1;--medal-light:#e1eff8;--medal-dark:#53748d}
.arcade-award.gold{--medal:#d7b263;--medal-light:#ffebaf;--medal-dark:#906a2f}
.arcade-award.diamond{--medal:#b7a3e5;--medal-light:#ebddff;--medal-dark:#7760aa}
.arcade-award.earned{border-color:color-mix(in srgb,var(--medal) 72%,#29455f);box-shadow:inset 0 1px 0 #ffffff15,0 4px 12px #071b2b45}
.arcade-award.earned:before{content:"";position:absolute;inset:0 0 auto;height:45%;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--medal) 10%,transparent),transparent)}
.arcade-award-icon{width:73px;height:73px;flex-shrink:0;display:grid;place-items:center;position:relative;z-index:0;font-size:30px;line-height:1;border-radius:50%;color:#f7e8d2;text-shadow:0 2px 4px #071a2b88;filter:none;background:radial-gradient(circle at 34% 24%,var(--medal-light),var(--medal) 48%,var(--medal-dark) 88%);border:3px solid var(--medal-light);outline:3px solid color-mix(in srgb,var(--medal-dark) 65%,#142c41);box-shadow:inset 0 2px 4px #ffffff55,inset 0 -5px 8px #091b3455,0 5px 11px #07142266}
.arcade-award-icon:before{content:"";position:absolute;inset:5px;border:1px dashed #ffffff75;border-radius:50%;pointer-events:none}
.arcade-award-icon:after{content:"";position:absolute;z-index:-1;width:29px;height:25px;top:-22px;left:19px;background:linear-gradient(90deg,#254d76 0 40%,#d7e7f1 40% 60%,#254d76 60%);clip-path:polygon(0 0,100% 0,83% 100%,17% 100%);border-radius:2px}
.arcade-award b{text-transform:none;font-size:13px;line-height:1.2;letter-spacing:.1px}
.arcade-award p{color:#b7cadb;font-size:11px}
.arcade-award-tier{color:var(--medal-light);letter-spacing:.45px;font-size:10px}
.arcade-award.earned .arcade-award-tier{color:#c8efda}
.arcade-award.locked{opacity:1;filter:none;border-color:#35516a;background:linear-gradient(150deg,#21374c,#172b3e)}
.arcade-award.locked .arcade-award-icon{filter:grayscale(.8);opacity:.48;box-shadow:inset 0 2px 4px #ffffff25,inset 0 -5px 8px #091b3455,0 3px 8px #07142244}
.arcade-award.locked b,.arcade-award.locked p{color:#91a9bc}
.arcade-award.locked .arcade-award-tier{color:#9eb5c6}

function tacticalScouting(tactic=g.tactic){
