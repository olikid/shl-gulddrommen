/* BETA 1.4.3 – visibly distinct newsroom lead, without redesigning the hub. */
.newsroom-banner{display:flex;flex-direction:column;gap:4px;border-radius:12px;background:linear-gradient(110deg,#0a2846,#16476b);border:1px solid #2677a4;border-left:4px solid #17adf5;padding:13px 14px;margin:0 0 14px}.newsroom-banner span{font-size:10px;font-weight:900;letter-spacing:1.3px;color:#58c8ff}.newsroom-banner strong{font-size:16px;color:#f5f8ff}.newsroom-banner small{font-size:11px;color:#b2cddd}.newsroom-lead{border-left:4px solid #17adf5!important;background:linear-gradient(130deg,#254b6b,#213c58)!important}.newsroom-lead .league-news-title{font-size:clamp(17px,4.4vw,21px);line-height:1.28;font-weight:900;color:#fff}.newsroom-lead p{font-size:13px;line-height:1.55}

.newsroom-pulse{display:inline-block;vertical-align:middle;width:9px;height:9px;margin-right:6px;border-radius:50%;background:#17adf5;box-shadow:0 0 8px #17adf5;animation:newsroom-beat 1.65s ease-in-out infinite}@keyframes newsroom-beat{0%,100%{opacity:.5;box-shadow:0 0 0 rgba(23,173,245,0)}50%{opacity:1;box-shadow:0 0 11px rgba(23,173,245,.95)}}@media(prefers-reduced-motion:reduce){.newsroom-pulse{animation:none;opacity:1}}

async function arcadeExportCode(){const button=document.getElementById('arcade-export-btn');if(button)button.disabled=true;try{if(typeof CompressionStream==='undefined')throw Error('GZIP stöds inte i den här webbläsaren');const payload={format:'HOCKEY-ARCADE-SAVE',version:1,state:g};const original=new TextEncoder().encode(JSON.stringify(payload));const compressed=await arcadeGzip(original);const code='HA2-'+arcadeBytesToBase64(compressed);const area=document.getElementById('arcade-export-code');if(area){area.value=code;area.focus();area.select()}const reduction=Math.round(100*(1-code.length/Math.ceil(original.length*4/3)));if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(code);alert('Komprimerad sparningskod kopierad! Cirka '+Math.max(0,reduction)+' % kortare än tidigare.')}catch{alert('Koden är klar men automatisk kopiering misslyckades. Kopiera den från textfältet.')}}else alert('Koden är klar! Kopiera den från textfältet.')}catch(e){console.error('Export failed',e);alert('Kunde inte komprimera sparningen: '+e.message)}finally{if(button)button.disabled=false}}
async function arcadeImportCode(){const area=document.getElementById('arcade-import-code');if(!area)return;const code=area.value.trim().split(/\s+/).join('');if(!code.startsWith('HA1-')&&!code.startsWith('HA2-'))return alert('Ogiltig kod. Den ska börja med HA1- eller HA2-.');let payload;try{if(code.startsWith('HA2-')){if(typeof DecompressionStream==='undefined')throw Error('GZIP stöds inte');const bytes=arcadeBase64ToBytes(code.slice(4));if(bytes.length>4000000)throw Error('Koden är för stor');const decompressed=await arcadeGunzip(bytes);if(decompressed.length>12000000)throw Error('Sparningen är för stor');payload=JSON.parse(new TextDecoder().decode(decompressed))}else payload=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))))}catch(e){console.error('Import decode failed',e);return alert('Koden kunde inte läsas. Kontrollera att hela koden kopierats.')}if(!payload||payload.format!=='HOCKEY-ARCADE-SAVE'||payload.version!==1||!arcadeValidSave(payload.state)||!Array.isArray(payload.state.seasons)||!Number.isInteger(payload.state.round)||payload.state.round<1||payload.state.round>52)return alert('Koden innehåller inte en giltig Hockey Arcade-karriär.');const imported=payload.state;const detail='Lag: '+(T[imported.team]||'Okänt')+' · '+imported.history.length+' spelade omgångar · '+imported.seasons.length+' avslutade säsonger';if(!confirm('ÅTERSTÄLL FRÅN SPARNINGSKOD?\\n\\n'+detail+'\\n\\nDin nuvarande karriär ersätts. Fortsätt?'))return;arcadeBackup('Före import av sparningskod');try{localStorage.setItem(arcadeSaveKey,JSON.stringify(imported));localStorage.removeItem(arcadeMatchKey)}catch(e){arcadeSaveWarning=true;return alert('Kunde inte spara den importerade karriären. Ingenting har ersatts i spelet.')}g=imported;applyRoster();shaMenuOpen=false;shaSettingsOpen=false;render();alert('Karriären är återställd från sparningskoden!')}

async function arcadeExportFile(){const button=document.getElementById('arcade-file-export-btn');if(button)button.disabled=true;try{if(typeof CompressionStream==='undefined')throw Error('Komprimering stöds inte i den här webbläsaren');const payload={format:'HOCKEY-ARCADE-SAVE',version:1,created:new Date().toISOString(),state:g};const bytes=await arcadeGzip(new TextEncoder().encode(JSON.stringify(payload)));const file=new Blob([bytes],{type:'application/gzip'});const name='hockey-arcade-'+new Date().toISOString().slice(0,10)+'.ha.gz';if(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File([file],name,{type:'application/gzip'})]})){try{await navigator.share({files:[new File([file],name,{type:'application/gzip'})],title:'Hockey Arcade – karriärsparning'});return}catch(e){if(e.name==='AbortError')return;console.warn('Share unavailable, using download',e)}}const url=URL.createObjectURL(file);const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){console.error('Save file export failed',e);alert('Kunde inte exportera sparfilen: '+e.message)}finally{if(button)button.disabled=false}}
async function arcadeImportFile(input){const file=input&&input.files&&input.files[0];if(!file)return;try{if(file.size>4000000)throw Error('Filen är för stor');let bytes=new Uint8Array(await file.arrayBuffer());let data;if(bytes[0]===31&&bytes[1]===139){if(typeof DecompressionStream==='undefined')throw Error('GZIP stöds inte');bytes=await arcadeGunzip(bytes);if(bytes.length>12000000)throw Error('Sparningen är för stor');data=JSON.parse(new TextDecoder().decode(bytes))}else{if(bytes.length>12000000)throw Error('Sparningen är för stor');data=JSON.parse(new TextDecoder().decode(bytes))}if(!data||data.format!=='HOCKEY-ARCADE-SAVE'||data.version!==1||!arcadeValidSave(data.state)||!Array.isArray(data.state.seasons)||!Number.isInteger(data.state.round)||data.state.round<1||data.state.round>52)throw Error('Filen innehåller ingen giltig Hockey Arcade-karriär');const imported=data.state;const detail='Lag: '+(T[imported.team]||'Okänt')+' · '+imported.history.length+' spelade omgångar · '+imported.seasons.length+' avslutade säsonger';if(!confirm('IMPORTERA SPARFIL?\\n\\n'+detail+'\\n\\nNuvarande karriär ersätts. Fortsätt?'))return;arcadeBackup('Före import av sparfil');try{localStorage.setItem(arcadeSaveKey,JSON.stringify(imported))}catch(e){arcadeSaveWarning=true;throw Error('Webbläsaren kunde inte lagra den importerade karriären')}try{localStorage.removeItem(arcadeMatchKey)}catch(e){console.warn('Could not clear old match checkpoint',e)}g=imported;applyRoster();shaMenuOpen=false;shaSettingsOpen=false;render();alert('Karriären är återställd från sparfilen!')}catch(e){console.error('Save file import failed',e);alert('Kunde inte importera sparfilen: '+e.message)}finally{input.value=''}}
